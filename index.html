<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Drift Raja: steer a Bajaj auto rickshaw across ten Mumbai neighbourhood flyovers. Hold to swing right, let go to swing left.">
<meta property="og:title" content="Drift Raja">
<meta property="og:description" content="One auto rickshaw, ten Mumbai flyovers, no brakes.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Drift Raja</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;600;700&display=swap">
<style>
/* Layout: one full-bleed WebGL flyover at dusk; UI floats on top as canopy-yellow cards and a fare-meter HUD. */
:root {
  --dusk: #2a1838;        /* deep plum night coming in */
  --haze: #d9708a;        /* Mumbai dusk haze, also the fog colour */
  --canopy: #ffc21a;      /* auto rickshaw roof yellow */
  --kerb: #17151c;        /* black of the kerb stripes */
  --auto-green: #1d8a4a;  /* CNG auto body green */
  --ink: #fff4e2;         /* warm paper white */
  --ink-dim: #e9cdbf;
  --card: rgba(36, 20, 46, 0.86);
  --font-display: "Rozha One", "Georgia", serif;
  --font-body: "Hind", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--dusk);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; background: var(--haze); }
#stage canvas { display: block; width: 100%; height: 100%; }

#ui {
  position: fixed; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; flex-direction: column;
}

/* HUD */
.hud { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.meter {
  display: flex; flex-direction: column; gap: 2px;
  background: var(--kerb); color: var(--canopy);
  border-radius: 10px; padding: 6px 14px 8px;
  box-shadow: 0 6px 18px rgba(0,0,0,.35);
  min-width: 120px;
}
.meter .label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.meter .value { font-family: var(--font-display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.meter .sub { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.meter.boost .sub { color: var(--canopy); font-weight: 700; }
.hud-right { display: flex; gap: 8px; align-items: center; }
.coins {
  background: var(--canopy); color: var(--kerb);
  border-radius: 999px; padding: 6px 14px 4px;
  font-family: var(--font-display); font-size: 22px; line-height: 1.1;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 18px rgba(0,0,0,.3);
}
.iconbtn {
  pointer-events: auto;
  width: 40px; height: 40px; border-radius: 999px; border: 0;
  background: rgba(23,21,28,.8); color: var(--ink);
  font: 600 13px var(--font-body); cursor: pointer;
}
.iconbtn:focus-visible, .cta:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* Popup words */
.popwrap { flex: 1; display: grid; place-items: center; }
.pop {
  font-family: var(--font-display); font-size: clamp(34px, 9vw, 64px);
  color: var(--canopy);
  text-shadow: 0 3px 0 var(--kerb), 0 8px 24px rgba(0,0,0,.4);
  animation: pop 1.1s ease-out forwards;
  margin-bottom: 30vh;
  text-align: center; text-wrap: balance;
}
.pop.big { font-size: clamp(44px, 12vw, 88px); animation: popbig 2.8s ease-out forwards; margin-bottom: 18vh; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pop-sub { font-family: var(--font-body); font-weight: 700; font-size: clamp(16px, 4vw, 22px); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); text-shadow: 0 2px 10px rgba(0,0,0,.5); }
@keyframes popbig {
  0% { transform: scale(.3) rotate(-8deg); opacity: 0; }
  12% { transform: scale(1.15) rotate(3deg); opacity: 1; }
  22% { transform: scale(1) rotate(0); }
  88% { opacity: 1; transform: scale(1.04); }
  100% { opacity: 0; transform: scale(1.04) translateY(-16px); }
}
@keyframes pop {
  0% { transform: scale(.4) rotate(-6deg); opacity: 0; }
  18% { transform: scale(1.12) rotate(2deg); opacity: 1; }
  30% { transform: scale(1) rotate(0); }
  75% { opacity: 1; }
  100% { transform: translateY(-30px); opacity: 0; }
}
.hint {
  text-align: center; font-weight: 600; font-size: 15px; color: var(--ink);
  text-shadow: 0 2px 8px rgba(0,0,0,.5);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 50% { opacity: .45; } }

/* Cards */
.center { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow-y: auto; pointer-events: auto; }
.center > .card { margin: auto; flex-shrink: 0; }
.turntable {
  height: 150px; margin: -18px -22px -4px;
  background: radial-gradient(ellipse 60% 70% at 50% 72%, rgba(255,194,26,.2), transparent 70%);
}
.turntable canvas { display: block; }
@media (max-height: 720px) { .turntable { height: 112px; } }
.card {
  pointer-events: auto;
  width: min(380px, 100%);
  background: var(--card);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(10, 4, 20, .55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  animation: rise .45s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.canopy {
  background: var(--canopy); color: var(--kerb);
  padding: 16px 22px 12px;
}
.canopy .deva { font-family: var(--font-display); font-size: 18px; letter-spacing: .02em; }
.canopy h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400;
  font-size: 54px; line-height: .95; letter-spacing: -.01em; text-wrap: balance;
}
.canopy h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 36px; line-height: 1; text-wrap: balance; }
.canopy .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; }
.kerb {
  height: 12px;
  background: repeating-linear-gradient(90deg, var(--kerb) 0 22px, var(--canopy) 22px 44px);
}
.card-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 16px; }
.tagline { margin: 0; color: var(--ink-dim); font-size: 16px; line-height: 1.45; }
.howto { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; margin: 0; align-items: center; }
.howto dt {
  font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  background: rgba(255,244,226,.1); border-radius: 6px; padding: 4px 8px 2px; text-align: center;
}
.howto dd { margin: 0; font-size: 15px; }
.cta {
  pointer-events: auto;
  border: 0; border-radius: 12px; cursor: pointer;
  background: var(--auto-green); color: var(--ink);
  font: 700 18px var(--font-body); padding: 14px 18px 11px;
  box-shadow: 0 4px 0 #11592f;
  transition: transform .08s;
}
.cta:active { transform: translateY(3px); box-shadow: 0 1px 0 #11592f; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: rgba(255,244,226,.07); border-radius: 10px; padding: 8px 10px 6px; }
.stat .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); font-weight: 600; }
.stat .value { font-family: var(--font-display); font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.badge {
  display: inline-block; background: var(--kerb); color: var(--canopy);
  border-radius: 999px; padding: 3px 10px 1px; font-size: 12px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; margin-top: 6px;
}
.foot { font-size: 13px; color: var(--ink-dim); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.credit {
  margin: 12px 0 0; text-align: center; font-size: 13px; color: var(--ink);
  text-shadow: 0 1px 6px rgba(0,0,0,.55);
}
.credit a { color: var(--canopy); font-weight: 700; text-decoration: underline; text-underline-offset: 2px; pointer-events: auto; }
.credit a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }
.foot kbd { font: 600 12px var(--font-body); background: rgba(255,244,226,.12); padding: 1px 6px; border-radius: 4px; }
.levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.lvl {
  pointer-events: auto; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  border: 0; border-radius: 10px; padding: 7px 2px 5px;
  background: rgba(255,244,226,.08); color: var(--ink);
  font-family: var(--font-body);
}
.lvl .num { font-family: var(--font-display); font-size: 20px; line-height: 1; }
.lvl .st { font-size: 10px; letter-spacing: .04em; color: var(--canopy); min-height: 12px; }
.lvl.on { background: var(--canopy); color: var(--kerb); }
.lvl.on .st { color: var(--kerb); }
.lvl:disabled { cursor: default; opacity: .45; }
.lvl:focus-visible, .ghost:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.pick { display: flex; flex-direction: column; gap: 0; }
.pick-name { font-family: var(--font-display); font-size: 26px; line-height: 1.1; }
.pick-sub { font-size: 14px; color: var(--ink-dim); }
.ghost {
  pointer-events: auto; cursor: pointer;
  border: 1.5px solid rgba(255,244,226,.3); border-radius: 12px;
  background: transparent; color: var(--ink);
  font: 600 15px var(--font-body); padding: 10px 14px 8px;
}
.card-body > .ghost + .ghost { margin-top: -8px; }
.progress { height: 6px; border-radius: 3px; background: rgba(255,244,226,.18); overflow: hidden; margin: 4px 0 2px; }
.progress .fill { height: 100%; background: var(--canopy); transition: width .2s; }
.bigstars { font-size: 30px; letter-spacing: .08em; line-height: 1.2; margin-top: 4px; }
@media (max-height: 640px) { .tagline { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .pop, .card, .hint { animation: none; }
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="ui"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(() => {
"use strict";

/* ---------- storage helpers ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem("driftraja:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("driftraja:" + k, JSON.stringify(v)); } catch (e) {} },
};

/* ---------- sound: a little tuk-tuk putter ---------- */
class Sound {
  constructor() { this.ctx = null; this.muted = store.get("muted", false); }
  init() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ctx) {
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.45;
      this.master.connect(ctx.destination);
      // shared white noise for the rumble texture and the tyre squeal
      const buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      const noise = () => { const n = ctx.createBufferSource(); n.buffer = buf; n.loop = true; n.start(); return n; };
      // low two-stroke rumble: two detuned low oscillators + filtered noise, chopped by a slow putt-putt LFO
      this.eng = ctx.createOscillator(); this.eng.type = "sawtooth"; this.eng.frequency.value = 32;
      this.eng2 = ctx.createOscillator(); this.eng2.type = "square"; this.eng2.frequency.value = 47;
      const e2g = ctx.createGain(); e2g.gain.value = 0.3;
      const filt = ctx.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = 230; filt.Q.value = 2;
      const rumbleLp = ctx.createBiquadFilter(); rumbleLp.type = "lowpass"; rumbleLp.frequency.value = 140;
      const rumbleG = ctx.createGain(); rumbleG.gain.value = 0.9;
      noise().connect(rumbleLp); rumbleLp.connect(rumbleG); rumbleG.connect(filt);
      this.amp = ctx.createGain(); this.amp.gain.value = 0.07;
      this.engGain = ctx.createGain(); this.engGain.gain.value = 0;
      this.lfo = ctx.createOscillator(); this.lfo.type = "square"; this.lfo.frequency.value = 8;
      const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.05;
      this.lfo.connect(lfoGain); lfoGain.connect(this.amp.gain);
      this.eng.connect(filt); this.eng2.connect(e2g); e2g.connect(filt);
      filt.connect(this.amp); this.amp.connect(this.engGain); this.engGain.connect(this.master);
      this.eng.start(); this.eng2.start(); this.lfo.start();
      // tyre squeal: band-passed hiss plus a wobbling tone
      const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 1900; bp.Q.value = 3;
      this.skidGain = ctx.createGain(); this.skidGain.gain.value = 0;
      noise().connect(bp); bp.connect(this.skidGain); this.skidGain.connect(this.master);
      this.squeal = ctx.createOscillator(); this.squeal.type = "triangle"; this.squeal.frequency.value = 1050;
      const vib = ctx.createOscillator(); vib.frequency.value = 23;
      const vibG = ctx.createGain(); vibG.gain.value = 45;
      vib.connect(vibG); vibG.connect(this.squeal.frequency);
      this.squealGain = ctx.createGain(); this.squealGain.gain.value = 0;
      this.squeal.connect(this.squealGain); this.squealGain.connect(this.master);
      this.squeal.start(); vib.start();
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
  }
  setMuted(m) {
    this.muted = m; store.set("muted", m);
    if (this.master) this.master.gain.setTargetAtTime(m ? 0 : 0.45, this.ctx.currentTime, 0.05);
  }
  engine(on, speed) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.engGain.gain.setTargetAtTime(on ? 1 : 0, t, 0.12);
    this.eng.frequency.setTargetAtTime(28 + speed * 1.3, t, 0.25);
    this.eng2.frequency.setTargetAtTime(41 + speed * 1.9, t, 0.25);
    this.lfo.frequency.setTargetAtTime(6 + speed * 0.45, t, 0.25);
  }
  skid(amount) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.skidGain.gain.setTargetAtTime(amount * 0.22, t, 0.04);
    this.squealGain.gain.setTargetAtTime(amount * 0.045, t, 0.04);
    this.squeal.frequency.setTargetAtTime(950 + amount * 250, t, 0.08);
  }
  tone(freq, dur, type = "sine", vol = 0.25, when = 0, slideTo = null) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  }
  coin() { this.tone(1320, 0.08, "triangle", 0.2); this.tone(1760, 0.14, "triangle", 0.2, 0.07); }
  boost() { this.tone(110, 0.35, "sawtooth", 0.1, 0.02, 260); }
  horn() { this.tone(392, 0.13, "square", 0.12); this.tone(392, 0.2, "square", 0.12, 0.18); }
  fall() { this.tone(520, 0.9, "sawtooth", 0.12, 0, 70); }
  cheer() { this.tone(660, 0.1, "triangle", 0.15); this.tone(880, 0.16, "triangle", 0.15, 0.09); }
}

/* ---------- textures ---------- */
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
const YELLOW = "#ffc21a", BLACK = "#17151c";

// Road top, with yellow-black kerb + white line only on the open edges.
// Canvas edges: left = -x, right = +x, top = -z, bottom = +z.
function roadTopTex(open) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = "#2b2932"; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 1400; i++) {
      const v = 40 + Math.random() * 40 | 0;
      g.fillStyle = `rgba(${v},${v - 4},${v + 10},0.55)`;
      g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
    const K = 18, L = 26, seg = 32;
    const kerb = (x, y, horiz) => {
      for (let i = 0; i < 256 / seg; i++) {
        g.fillStyle = i % 2 ? BLACK : YELLOW;
        if (horiz) g.fillRect(i * seg, y, seg, K); else g.fillRect(x, i * seg, K, seg);
      }
    };
    g.fillStyle = "rgba(255,255,255,.75)";
    if (open & 2) g.fillRect(L, 0, 4, h);
    if (open & 1) g.fillRect(w - L - 4, 0, 4, h);
    if (open & 8) g.fillRect(0, L, w, 4);
    if (open & 4) g.fillRect(0, h - L - 4, w, 4);
    if (open & 2) kerb(0, 0, false);
    if (open & 1) kerb(w - K, 0, false);
    if (open & 8) kerb(0, 0, true);
    if (open & 4) kerb(0, h - K, true);
  });
}
const roadSideTex = canvasTex(128, 64, (g, w, h) => {
  g.fillStyle = "#8d8292"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#6f6476"; g.fillRect(0, h - 16, w, 16);
  for (let i = 0; i < 4; i++) { g.fillStyle = i % 2 ? BLACK : YELLOW; g.fillRect(i * 32, 0, 32, 20); }
});
const windowTex = [], litTex = [];
for (let v = 0; v < 3; v++) {
  const lit = [];
  for (let i = 0; i < 64; i++) lit.push(Math.random() < 0.38);
  const draw = (emissive) => (g, w, h) => {
    g.fillStyle = emissive ? "#000" : "#fff"; g.fillRect(0, 0, w, h);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const x = c * 32 + 8, y = r * 32 + 7;
      if (emissive) {
        if (lit[r * 8 + c]) { g.fillStyle = Math.random() < 0.3 ? "#ffe9b0" : "#ffffff"; g.fillRect(x, y, 16, 19); }
      } else {
        g.fillStyle = "#4a4060"; g.fillRect(x, y, 16, 19);
        g.fillStyle = "rgba(0,0,0,.12)"; g.fillRect(c * 32, r * 32 + 28, 32, 3);
      }
    }
  };
  windowTex.push(canvasTex(256, 256, draw(false), true));
  litTex.push(canvasTex(256, 256, draw(true), true));
}
const coinFaceTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = "#ffcb2e"; g.fillRect(0, 0, w, h);
  g.strokeStyle = "#c98a00"; g.lineWidth = 8; g.beginPath(); g.arc(64, 64, 52, 0, Math.PI * 2); g.stroke();
  g.fillStyle = "#a86f00"; g.font = "bold 76px Hind, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("₹", 64, 68);
});
const plateTex = canvasTex(256, 64, (g, w, h) => {
  g.fillStyle = YELLOW; g.fillRect(0, 0, w, h);
  g.strokeStyle = BLACK; g.lineWidth = 6; g.strokeRect(3, 3, w - 6, h - 6);
  g.fillStyle = BLACK; g.font = "bold 40px Hind, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText("MH 02 RJ 786", w / 2, h / 2 + 3);
});

/* ---------- the Bajaj-style auto rickshaw ---------- */
function makeRickshaw() {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const M = (c, o) => new THREE.MeshLambertMaterial(Object.assign({ color: c }, o || {}));
  const green = M(0x1d8a4a), yellow = M(0xffc21a), black = M(0x1b1b1f), seat = M(0x7a3b2a),
    glass = M(0xa8dcff, { transparent: true, opacity: 0.4 }), tyre = M(0x141416), hub = M(0xc9ccd4),
    khaki = M(0xb59a5e), skin = M(0x8a5a3c), hair = M(0x1a1412),
    head = new THREE.MeshBasicMaterial({ color: 0xfff2b0 }), tail = new THREE.MeshBasicMaterial({ color: 0xff3a2a }),
    plate = new THREE.MeshBasicMaterial({ map: plateTex });
  const box = (w, h, d, m, x, y, z, parent) => {
    const me = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
    me.position.set(x, y, z); me.castShadow = true; (parent || body).add(me); return me;
  };
  // rear passenger tub
  box(1.1, 0.46, 1.2, green, 0, 0.55, -0.4);

function groundTexFor(t) {

  const tex = canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = gd.base; g.fillRect(0, 0, w, h);

      for (let i = 0; i < 70; i++) {
        const x = Math.random() * w, y = Math.random() * h, l = 8 + Math.random() * 22;
        g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l / 2, y - 4, x + l, y); g.stroke();
      }

      g.fillStyle = gd.street; g.fillRect(0, 118, w, 20); g.fillRect(118, 0, 20, h);

      for (let i = 0; i < 40; i++) g.fillRect(Math.random() * w, Math.random() * h, 2, 2);

  tex.repeat.set(400 / 22, 400 / 22);

}

function finishTopTex(open, alongX) {

}

// A small showroom turntable so the rickshaw reads clearly on the start screen.
function Turntable() {
  const ref = useRef(null);
  useEffect(() => {
    const host = ref.current;
    let r;
    try { r = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { return; }
    r.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    const hh = host.clientHeight;
    r.setSize(host.clientWidth, hh);
    host.appendChild(r.domElement);
    const sc = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(28, host.clientWidth / hh, 0.1, 50);
    cam.position.set(0, 2.2, 5.6); cam.lookAt(0, 0.95, 0);
    sc.add(new THREE.HemisphereLight(0xfff1e0, 0x50306a, 1.0));
    const key = new THREE.DirectionalLight(0xffe0c0, 0.8); key.position.set(3, 5, 4); sc.add(key);
    const car = makeRickshaw(); car.root.scale.setScalar(1.2); sc.add(car.root);
    const disc = new THREE.Mesh(new THREE.CylinderGeometry(1.95, 1.95, 0.12, 48), new THREE.MeshLambertMaterial({ color: 0x2b2932 }));
    disc.position.y = -0.06; sc.add(disc);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.95, 0.07, 6, 48), new THREE.MeshLambertMaterial({ color: 0xffc21a }));
    ring.rotation.x = Math.PI / 2; sc.add(ring);
    let raf, last = performance.now(), t = 0;
    const loop = (now) => {
      const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt;
      car.root.rotation.y += dt * 0.9;
      car.body.position.y = Math.abs(Math.sin(t * 18)) * 0.02;
      car.charm.rotation.z = Math.sin(t * 3) * 0.25;
      r.render(sc, cam);
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    const onResize = () => { const w = host.clientWidth; r.setSize(w, hh); cam.aspect = w / hh; cam.updateProjectionMatrix(); };
    window.addEventListener("resize", onResize);
    return () => {
      cancelAnimationFrame(raf); window.removeEventListener("resize", onResize);

        sound.engine(false, 0); sound.horn(); sound.cheer();
        const n = modeRef.current.n, last = n + 1 >= LEVEL_COUNT;
        const cheer = CHEERS[Math.floor(Math.random() * CHEERS.length)];
        setPopup({ text: cheer, sub: last ? "All ten neighbourhoods cleared" : THEMES[n].name + " cleared", big: true, k: "f" + Date.now() });
      },
      onOver: (s, c) => {
        const m = modeRef.current, endless = m.type === "endless";
        const isBest = endless && s > bestRef.current;
        if (isBest) { setBest(s); store.set("best", s); }
        bankCoins(c);
        setResult({ score: s, coins: c, isBest, line: FALL_LINES[Math.floor(Math.random() * FALL_LINES.length)] });
        setPhase("over");
      },
      onFinish: (c, total) => {
        const n = modeRef.current.n, earned = starsFor(c, total);
        bankCoins(c);
        setStars(prev => { const v = Object.assign({}, prev, { [n + 1]: Math.max(prev[n + 1] || 0, earned) }); store.set("stars", v); return v; });
        setUnlocked(prev => { const v = Math.max(prev, Math.min(n + 2, LEVEL_COUNT)); store.set("unlocked", v); return v; });
        setSelected(Math.min(n + 1, LEVEL_COUNT - 1));
        setResult({ coins: c, total, earned, n });
        setPhase("cleared");
      },
    });
    g.load(modeRef.current);
    window.__driftRaja = g;
    return () => g.destroy();
  }, []);

  useEffect(() => {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === "function") { try { hot.snapshot(() => ({ best, gullak, unlocked, stars })); } catch (e) {} }
  }, [best, gullak, unlocked, stars]);

  const start = useCallback((m) => {
    m = m || modeRef.current;
    sound.init(); sound.horn();
    game.current.start(m);
    setMode(m); modeRef.current = m;
    setScore(0); setCoins(0); setSpeed(game.current.speed); setTouched(false);
    const t = m.type === "level" ? THEMES[m.n] : null;
    setPopup({ text: t ? "Level " + (m.n + 1) + " · " + t.name : "Endless Mumbai", k: "s" + Date.now() });
    setPhase("play");
  }, []);

  const toMenu = useCallback(() => {
    const m = { type: "level", n: selectedRef.current };
    game.current.load(m); setMode(m); modeRef.current = m;
    setPhase("menu");
  }, []);
  const selectedRef = useRef(selected); selectedRef.current = selected;

  const pick = (n) => {
    setSelected(n);
    const m = { type: "level", n };
    game.current.load(m); setMode(m); modeRef.current = m;
  };

  useEffect(() => {
    const stage = document.getElementById("stage");
    const down = (e) => {
      if (phaseRef.current !== "play") return;
      e.preventDefault();
      game.current.holding = true; setTouched(true);
    };
    const up = () => { if (game.current) game.current.holding = false; };
    const key = (e) => {
      if (e.code !== "Space" && e.code !== "ArrowRight" && e.code !== "Enter") return;
      if (phaseRef.current !== "play" && e.target && e.target.tagName === "BUTTON") return; // let the focused button handle it
      e.preventDefault();
      if (e.repeat) return;
      if (phaseRef.current === "play") { if (e.code !== "Enter") { game.current.holding = true; setTouched(true); } }
      else if (phaseRef.current === "cleared") {
        const n = modeRef.current.n;
        start(n + 1 < LEVEL_COUNT ? { type: "level", n: n + 1 } : { type: "endless" });
      } else start();
    };
    const keyUp = (e) => { if (e.code === "Space" || e.code === "ArrowRight") up(); };
    const noMenu = (e) => e.preventDefault();
    stage.addEventListener("pointerdown", down);
    window.addEventListener("pointerup", up); window.addEventListener("pointercancel", up); window.addEventListener("blur", up);
    window.addEventListener("keydown", key); window.addEventListener("keyup", keyUp);
    window.addEventListener("contextmenu", noMenu);
    return () => {
      stage.removeEventListener("pointerdown", down);
      window.removeEventListener("pointerup", up); window.removeEventListener("pointercancel", up); window.removeEventListener("blur", up);
      window.removeEventListener("keydown", key); window.removeEventListener("keyup", keyUp);
      window.removeEventListener("contextmenu", noMenu);
    };
  }, [start]);

  useEffect(() => { if (phase === "play") sound.engine(true, speed); }, [phase, speed]);

  const toggleMute = (e) => { e.stopPropagation(); sound.setMuted(!muted); setMuted(!muted); };
  const muteBtn = h("button", { id: "mute", className: "iconbtn", onClick: toggleMute, onPointerDown: e => e.stopPropagation(), "aria-label": muted ? "Turn sound on" : "Turn sound off" }, muted ? "Off" : "On");

  const isLevel = mode.type === "level";
  const total = isLevel ? levelLength(mode.n) : 0;
  const hud = h("div", { className: "hud" },
    h("div", { className: "meter" + (boosting ? " boost" : ""), "aria-live": "polite" },
      h("span", { className: "label" }, isLevel ? "Level " + (mode.n + 1) + " · " + THEMES[mode.n].name : "Endless · tiles"),
      h("span", { className: "value" }, isLevel ? Math.min(score, total) + "/" + total : score),
      isLevel
        ? h("div", { className: "progress", "aria-hidden": "true" }, h("div", { className: "fill", style: { width: Math.min(100, score / total * 100) + "%" } }))
        : null,
      h("span", { className: "sub" }, Math.round(speed * 4.2) + " km/h" + (boosting ? " · boost!" : "") + (isLevel ? "" : " · best " + best))),
    h("div", { className: "hud-right" },
      h("div", { className: "coins", "aria-label": coins + " coins" }, "₹ " + coins),
      muteBtn));

  const kerbCard = (label, head, children) => h("div", { className: "center" },
    h("div", { className: "card", role: "dialog", "aria-label": label },
      h("div", { className: "canopy" }, head),
      h("div", { className: "kerb" }),
      h("div", { className: "card-body" }, children)),
    h("p", { className: "credit" }, "A ", h("a", { href: "https://superfresh.la", target: "_blank", rel: "noopener" }, "Superfresh"), " game."));

  let body = null;
  if (phase === "menu") {
    const t = THEMES[selected];
    body = kerbCard("Drift Raja", [
      h("div", { className: "deva", lang: "hi", key: "d" }, "ड्रिफ्ट राजा"),
      h("h1", { key: "h" }, "Drift Raja"),
    ], [
      h(Turntable, { key: "tt" }),
      h("p", { className: "tagline", key: "t" }, "Ten Mumbai neighbourhoods, one auto rickshaw. Hold to swing right, let go to swing left, reach the finish line."),
      h("div", { className: "levels", role: "group", "aria-label": "Choose a level", key: "l" },
        THEMES.map((th, i) => {
          const locked = i + 1 > unlocked;
          return h("button", {
            key: i, id: "lvl-" + (i + 1), className: "lvl" + (i === selected ? " on" : ""), disabled: locked,
            onClick: () => pick(i), "aria-pressed": i === selected, "aria-label": "Level " + (i + 1) + " " + th.name + (locked ? " locked" : ""),
          }, h("span", { className: "num" }, locked ? "🔒" : i + 1), h("span", { className: "st" }, stars[i + 1] ? starText(stars[i + 1]) : locked ? "" : "new"));
        })),
      h("div", { className: "pick", key: "p" },
        h("span", { className: "pick-name" }, t.name),
        h("span", { className: "pick-sub" }, t.sub + " · " + levelLength(selected) + " tiles")),
      h("button", { id: "start", className: "cta", onClick: () => start({ type: "level", n: selected }), key: "s" }, "Ride to " + t.name),
      h("button", { id: "endless", className: "ghost", onClick: () => start({ type: "endless" }), key: "e" }, "Endless Mumbai · best " + best),
      h("div", { className: "foot", key: "f" },
        h("span", null, "Total saved ₹" + gullak),
        h("span", null, h("kbd", null, "Space"), " to start")),
    ]);
  } else if (phase === "over" && result) {
    body = kerbCard("Ride over", [
      h("div", { className: "eyebrow", key: "e" }, isLevel ? "Level " + (mode.n + 1) + " · " + THEMES[mode.n].name : "Endless Mumbai"),
      h("h2", { key: "h" }, result.line),
      result.isBest ? h("span", { className: "badge", key: "b" }, "New best") : null,
    ], [
      h("div", { className: "stats", key: "s" },
        h("div", { className: "stat" }, h("div", { className: "label" }, "Tiles"), h("div", { className: "value" }, isLevel ? result.score + "/" + total : result.score)),
        isLevel
          ? h("div", { className: "stat" }, h("div", { className: "label" }, "To go"), h("div", { className: "value" }, Math.max(0, total - result.score)))
          : h("div", { className: "stat" }, h("div", { className: "label" }, "Best"), h("div", { className: "value" }, best)),
        h("div", { className: "stat" }, h("div", { className: "label" }, "Coins"), h("div", { className: "value" }, "₹" + result.coins))),
      h("button", { id: "again", className: "cta", onClick: () => start(), autoFocus: true, key: "a" }, isLevel ? "Try " + THEMES[mode.n].name + " again" : "Ride again"),
      h("button", { id: "levels", className: "ghost", onClick: toMenu, key: "m" }, "All levels"),
      h("div", { className: "foot", key: "f" }, h("span", null, "Total saved ₹" + gullak), muteBtn),
    ]);
  } else if (phase === "cleared" && result) {
    const last = result.n + 1 >= LEVEL_COUNT;
    const next = last ? null : THEMES[result.n + 1];
    body = kerbCard("Level cleared", [
      h("div", { className: "eyebrow", key: "e" }, "Level " + (result.n + 1) + " cleared"),
      h("h2", { key: "h" }, last ? "Lalbaug ka Raja! All ten cleared." : THEMES[result.n].name + " done!"),
      h("div", { className: "bigstars", key: "s", "aria-label": result.earned + " of 3 stars" }, starText(result.earned)),
    ], [
      h("div", { className: "stats", key: "s" },
        h("div", { className: "stat" }, h("div", { className: "label" }, "Coins"), h("div", { className: "value" }, result.coins + "/" + result.total)),
        h("div", { className: "stat" }, h("div", { className: "label" }, "Tiles"), h("div", { className: "value" }, levelLength(result.n))),
        h("div", { className: "stat" }, h("div", { className: "label" }, "Saved"), h("div", { className: "value" }, "₹" + gullak))),
      h("p", { className: "tagline", key: "t" }, "Stars: finish for one, grab half the coins for two, 90% for three."),
      last
        ? h("button", { id: "next", className: "cta", onClick: () => start({ type: "endless" }), autoFocus: true, key: "n" }, "Ride Endless Mumbai")
        : h("button", { id: "next", className: "cta", onClick: () => start({ type: "level", n: result.n + 1 }), autoFocus: true, key: "n" }, "Next: " + next.name),
      h("button", { id: "replay", className: "ghost", onClick: () => start({ type: "level", n: result.n }), key: "r" }, "Replay for more coins"),
      h("button", { id: "levels", className: "ghost", onClick: toMenu, key: "m" }, "All levels"),
    ]);
  } else if (phase === "play") {
    body = h("div", { className: "popwrap" },
      popup ? h("div", { className: "pop" + (popup.big ? " big" : ""), key: popup.k }, popup.text, popup.sub ? h("span", { className: "pop-sub" }, popup.sub) : null) : null,
      !touched ? h("div", { className: "hint", style: { position: "absolute", bottom: "calc(env(safe-area-inset-bottom, 0px) + 40px)", left: 0, right: 0 } }, "Hold to swing right · let go to swing left") : null);
  }

  return h(React.Fragment, null, phase === "play" ? hud : null, body);
}

function boot(data) {
  data = data || {};
  const initial = {
    best: Math.max(store.get("best", 0), data.best || 0),
    gullak: Math.max(store.get("gullak", 0), data.gullak || 0),
    unlocked: Math.max(store.get("unlocked", 1), data.unlocked || 1),
    stars: Object.assign({}, data.stars || {}, store.get("stars", {})),
  };
  ReactDOM.createRoot(document.getElementById("ui")).render(h(App, { initial }));
}
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.ready === "function") hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
</body>
</html>
